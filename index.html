<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/control-economico/favicon.ico">
<title>Control — Control Económico</title>
<script>
  // Aplicar el tema guardado ANTES de que cargue el CSS, para no mostrar un flash del tema claro
  // al entrar de nuevo con el oscuro elegido.
  try{
    if(localStorage.getItem('controlTema') === 'oscuro') document.documentElement.setAttribute('data-theme','oscuro');
  }catch(e){}
</script>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
<div class="login-wrap" id="loginWrap" style="display:none">
  <div class="login-card">
    <h1 style="font-size:24px;margin-bottom:4px">Control</h1>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:20px">Iniciá sesión para ver tu control económico</div>
    <div id="loginMsg"></div>
    <div class="field" style="margin-bottom:10px"><label>Email</label><input type="email" id="login-email" style="width:100%"></div>
    <div class="field" style="margin-bottom:16px"><label>Contraseña</label><input type="password" id="login-password" style="width:100%"></div>
    <button id="btnLogin" style="width:100%">Iniciar sesión</button>
  </div>
</div>
<div class="app" id="app" style="display:none">
  <div class="loading">Cargando datos...</div>
</div>

<script src="app.js"></script>
</body>
</html>
